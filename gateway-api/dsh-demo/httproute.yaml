apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: dsh-gateway
  namespace: dsh-demo
  labels:
    app.kubernetes.io/part-of: dsh-demo
spec:
  parentRefs:
    - name: dsh-gateway
      namespace: dsh-demo
      sectionName: https
  hostnames:
    # TODO: replace with the actual public FQDN once provided.
    - dsh-demo.example.com
  rules:
    - backendRefs:
        - name: dsh-gateway
          port: 8080
