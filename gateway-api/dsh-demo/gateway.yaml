apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: dsh-gateway
  namespace: dsh-demo
  labels:
    app.kubernetes.io/part-of: dsh-demo
spec:
  gatewayClassName: traefik
  listeners:
    - name: https
      port: 8443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - name: dsh-demo-tls
      allowedRoutes:
        namespaces:
          from: Same
