[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# S110 is flake8-bandit's try-except-pass, the ruff equivalent of CodeQL's
# py/empty-except: a handler that silently drops an exception hides failures.
# Use contextlib.suppress(ExpectedError) to say "deliberately ignored", or log.
select = ["E", "F", "I", "B", "UP", "PIE", "RUF", "S110"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"test_gateway.py" = ["E501"]
