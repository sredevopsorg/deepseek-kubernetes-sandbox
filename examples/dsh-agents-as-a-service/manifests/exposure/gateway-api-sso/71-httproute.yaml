# Routes the public host to oauth2-proxy (GitHub OAuth), which authenticates
# the browser and forwards to dsh-gateway:8080 with X-Forwarded-User set.
#
# Applied by this variant's kustomization.yaml, which includes the base:
#
#   kubectl apply -k manifests/exposure/gateway-api-sso
#
# The hostname below is the single source of truth for the public host: the
# overlay copies it into the SandboxTemplate DSH_TRUSTED_HOSTS env so DSH
# trusts the browser Host/Origin on /api. Change it here only.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: dsh-gateway
  namespace: dsh-demo
  labels:
    app.kubernetes.io/part-of: dsh-demo
spec:
  parentRefs:
    - name: dsh-gateway
      namespace: dsh-demo
      sectionName: https
  hostnames:
    # TODO: replace with the actual public FQDN before applying (the
    # kustomization copies it into DSH_TRUSTED_HOSTS).
    - dsh-demo.example.com
  rules:
    - backendRefs:
        # Route through oauth2-proxy (GitHub OAuth) first; it authenticates the
        # browser and forwards to dsh-gateway:8080 with X-Forwarded-User set.
        # The gateway only trusts that header because this variant's
        # kustomization.yaml sets AUTH_PROXY_HEADER on its Deployment (see
        # 72-oauth2-proxy.yaml and ../README.md).
        - name: oauth2-proxy
          port: 4180
