# Browser entry point (TLS) for the gateway-api-sso variant: terminates TLS
# for the public host and routes through 71-httproute.yaml to oauth2-proxy,
# which authenticates the browser before the gateway.
#
# Apply the whole variant with one command from the example root:
#
#   kubectl apply -k manifests/exposure/gateway-api-sso
#
# The kustomization.yaml next to this file includes ../../base, enables SSO on
# the gateway Deployment, keeps DSH_TRUSTED_HOSTS in sync with the HTTPRoute
# hostname and applies 75-networkpolicies.yaml, so no manual `kubectl set env`
# is needed. This variant is MUTUALLY EXCLUSIVE with ../ingress/ (see
# ../README.md). The "dsh-demo-tls" Secret comes from
# 74-tls-secret.yaml.example.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: dsh-gateway
  namespace: dsh-demo
  labels:
    app.kubernetes.io/part-of: dsh-demo
spec:
  gatewayClassName: traefik
  listeners:
    - name: https
      port: 8443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - name: dsh-demo-tls
      allowedRoutes:
        namespaces:
          from: Same
