# OPTIONAL browser entry point: expose the gateway through Traefik.
#
# This is the "no SSO" exposure variant and is MUTUALLY EXCLUSIVE with
# ../gateway-api-sso/ — apply exactly one of them (see ../README.md).
#
# Apply the whole variant (base manifests + this Ingress + its NetworkPolicy)
# with one command from the example root:
#
#   kubectl apply -k manifests/exposure/ingress
#
# The kustomization.yaml next to this file includes ../../base and patches it,
# so no manual `kubectl set env` is needed:
#   - gateway Deployment: COOKIE_SECURE="true" and ALLOW_INSECURE_COOKIES
#     removed, because this Ingress serves HTTPS and the session cookie must be
#     Secure;
#   - this rule's host is copied into the TLS SAN and into the SandboxTemplate
#     DSH_TRUSTED_HOSTS env (DSH fences /api on Host/Origin).
# Change the public host ONLY in the rule below; everything else follows.
#
# Requires a Traefik install with an IngressClass named "traefik" (k3s ships
# one). Replace the placeholder host below with a name that resolves to your
# ingress address, and either supply a real TLS Secret (the placeholder
# dsh-example-tls) or, for plain HTTP only, delete the `tls:` block AND the
# Ingress TLS replacement target in kustomization.yaml, then set COOKIE_SECURE
# back to "false" and replace the ALLOW_INSECURE_COOKIES `$patch: delete` entry
# with `value: "1"` there. Plain HTTP is for the local demo only: the session
# cookie would travel in clear text.
#
# WebSocket support is REQUIRED: the browser talks to /u/<user>/... and DSH
# uses WebSockets for live session traffic. Traefik upgrades WS/SSE
# transparently for ordinary HTTP routers, but do NOT attach buffering
# middlewares (e.g. compress, buffering) to this router — they break streaming
# and upgrades. `path: /` Prefix covers the landing page and every per-user
# proxy path, so no per-sandbox Ingress is needed.
#
# 61-networkpolicy.yaml is part of this variant (the overlay applies it) and
# required for production: it restricts the gateway's ingress to Traefik pods.
# Adjust its selector if your ingress controller uses a different label or
# hostNetwork. The sandbox and gateway-egress NetworkPolicies are separate
# requirements; see
# ../../../docs/optional-hardening.md#6-production-checklist.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dsh-gateway
  namespace: dsh-demo
  # Typical Traefik + cert-manager wiring (uncomment and adapt):
  # annotations:
  #   traefik.ingress.kubernetes.io/router.entrypoints: websecure
  #   cert-manager.io/cluster-issuer: letsencrypt-prod
  annotations: {}
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - dsh.example.com # placeholder
      secretName: dsh-example-tls # placeholder; create/PKI-provision this Secret
  rules:
    - host: dsh.example.com # placeholder
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dsh-gateway
                port:
                  number: 8080
