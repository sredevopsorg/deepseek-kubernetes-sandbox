# SSO-only: restrict GitHub login to members of one organization.
#
# TODO: replace `your-github-org` with the real organization.
# Requires composing with ../exposure/gateway-api-sso; the oauth2-proxy
# Deployment exists only in that overlay, so this patch matches nothing without
# it. The base arg list of 72-oauth2-proxy.yaml starts:
#   0 --http-address, 1 --provider=github, 2 --github-org, 3 --email-domain,
#   4 --upstream, 5 --redirect-url  (see also the redirect-url patch).
# If you edit that arg list, update the index here.
#
# Enable by uncommenting this entry under `patches:` in
# manifests/local/kustomization.yaml:
#
#   patches:
#     - path: patches/oauth2-proxy-github-org.yaml
#       target:
#         group: apps
#         version: v1
#         kind: Deployment
#         name: oauth2-proxy
#
# This is a JSON 6902 patch (a list), so the target above is REQUIRED.
- op: replace
  path: /spec/template/spec/containers/0/args/2
  value: --github-org=your-github-org
