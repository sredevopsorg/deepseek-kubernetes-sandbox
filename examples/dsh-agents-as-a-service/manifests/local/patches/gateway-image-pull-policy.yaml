# OPTIONAL: change the gateway imagePullPolicy (base: IfNotPresent).
#
# TODO: use Always for a mutable tag (so a repushed tag is picked up on
# restart), IfNotPresent for an immutable tag/digest or a locally loaded image
# (kind e2e). Pair it with the `images:` block in kustomization.yaml when
# pinning the image.
#
# This is a STRATEGIC-MERGE patch (a partial object), not a JSON 6902 list, so
# it needs no JSON `target`; the kind/name/namespace and the container name
# below identify the object/container. Enable by uncommenting this entry under
# `patches:` in manifests/local/kustomization.yaml:
#
#   patches:
#     - path: patches/gateway-image-pull-policy.yaml
#       target:
#         group: apps
#         version: v1
#         kind: Deployment
#         name: dsh-gateway
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dsh-gateway
  namespace: dsh-demo
spec:
  template:
    spec:
      containers:
        - name: gateway
          imagePullPolicy: Always
