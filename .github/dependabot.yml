version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore: "

  - package-ecosystem: pip
    directory: /examples/dsh-agents-as-a-service/gateway
    schedule:
      interval: weekly
    groups:
      gateway-python:
        patterns: ["*"]
    commit-message:
      prefix: "chore: "

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore: "

  - package-ecosystem: docker
    directory: /examples/dsh-agents-as-a-service/gateway
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore: "
